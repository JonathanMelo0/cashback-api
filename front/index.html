<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultor de Cashback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app">
        <h1>Consultor de Cashback</h1>
        
        <div class="campo">
            <label for="valorCompra">Valor da Compra (R$):</label>
            <input type="number" id="valorCompra" placeholder="0.00">
        </div>

        <div class="campo">
            <label for="tipoCliente">Tipo de Cliente:</label>
            <select id="tipoCliente">
                <option value="comum">Comum</option>
                <option value="vip">VIP</option>
            </select>
        </div>

        <!-- NOVO CAMPO -->
        <div class="campo">
            <label for="cupom">Cupom de Desconto (%):</label>
            <input type="number" id="cupom" placeholder="Ex: 10 (deixe 0 se não tiver)">
        </div>

        <button id="btnCalcular">Calcular Agora</button>

        <div id="resultado"></div>

        <section id="historico-container">
            <h2>Histórico de Consultas</h2>
            <ul id="listaHistorico"></ul>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
